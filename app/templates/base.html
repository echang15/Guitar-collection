<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Guitar Collection{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/">🎸 Guitar Collection</a>
    <nav>
      <a href="/?status=current">Current</a>
      <a href="/?status=archived">Archive</a>
      <a class="btn btn-primary" href="/guitars/new">+ Add guitar</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
